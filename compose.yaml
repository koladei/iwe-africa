services:
  iwe-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_REPO:-koladei/iwe-africa}:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-iwe-app}
    restart: unless-stopped
    env_file: env/iwe.env
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: ${DOCKER_REPO:-koladei/iwe-africa}:${IMAGE_TAG:-latest}-worker
    container_name: ${WORKER_CONTAINER_NAME:-iwe-worker}
    restart: unless-stopped
    env_file: env/iwe.env
