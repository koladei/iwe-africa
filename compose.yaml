services:
  app:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://iwe:${POSTGRES_PASSWORD:-change-this-before-production}@postgres:5432/iwe?schema=public
      REDIS_URL: redis://redis:6379
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://iwe:${POSTGRES_PASSWORD:-change-this-before-production}@postgres:5432/iwe?schema=public
      REDIS_URL: redis://redis:6379
  redis:
    image: redis:7-alpine
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iwe
      POSTGRES_USER: iwe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-before-production}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iwe -d iwe"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
